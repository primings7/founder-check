<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>창업가 역량 진단 관리자</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@600;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* 레이아웃: 좁은 한 단(최대 760px) 진단지. 카드는 질문 묶음에만, 강조색은 선택 상태와 그래프에만 쓴다 */
  --paper:#F2F5F4; --surface:#FFFFFF; --ink:#16212A; --muted:#5A6870; --line:#D3DBD8;
  --accent:#0B6E5E; --accent-ink:#FFFFFF; --accent-soft:#DDEFEA; --second:#3A5BA0; --second-soft:#E2E9F6;
  --warn:#A8500C; --warn-soft:#FBEBDD;
  --display:"Hahmlet","Noto Serif KR","Apple SD Gothic Neo",serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F1615; --surface:#182220; --ink:#E7EDEB; --muted:#9BABA7; --line:#2C3A37;
  --accent:#58C7B0; --accent-ink:#06211C; --accent-soft:#1D3A34; --second:#8FB0F0; --second-soft:#222F4A;
  --warn:#F2A766; --warn-soft:#3A2A1B; color-scheme:dark;}}
:root[data-theme="dark"]{
  --paper:#0F1615; --surface:#182220; --ink:#E7EDEB; --muted:#9BABA7; --line:#2C3A37;
  --accent:#58C7B0; --accent-ink:#06211C; --accent-soft:#1D3A34; --second:#8FB0F0; --second-soft:#222F4A;
  --warn:#F2A766; --warn-soft:#3A2A1B; color-scheme:dark;}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;word-break:keep-all;overflow-wrap:anywhere}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 56px;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding:4px 2px}
header.top h1{font-family:var(--display);font-size:20px;margin:0;font-weight:700}
header.top span{color:var(--muted);font-size:13px}
#progress{list-style:none;display:flex;gap:6px;margin:0;padding:0;overflow-x:auto}
#progress li{flex:1 0 auto;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding:6px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
#progress li span{font-variant-numeric:tabular-nums;font-weight:600}
#progress li.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#progress li.done{background:var(--accent-soft);color:var(--ink);border-color:transparent}
#view{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:12px}
.card>*{margin:0}
h2{font-family:var(--display);font-size:26px;line-height:1.3;font-weight:700;text-wrap:balance;outline:none}
h3{font-size:18px;font-weight:600}
h4{font-size:15px;font-weight:600;margin:8px 0 0;color:var(--accent)}
p{margin:0}
.lead{font-size:17px}
.eyebrow{font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.02em}
.fine{font-size:13px;color:var(--muted)}
.hero{border-top:4px solid var(--accent)}
.parts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;counter-reset:p}
.parts li{counter-increment:p;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column}
.parts li b::before{content:counter(p) ". "}
.parts li span{font-size:13px;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px;font-weight:500}
.field .opt{font-weight:400;color:var(--muted);border:0;padding:0;background:none}
input[type=text],textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;resize:vertical;word-break:break-all}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:11px 18px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--second);outline-offset:2px}
.nav{display:flex;align-items:center;gap:12px;position:sticky;bottom:0;background:var(--paper);padding:12px 0;border-top:1px solid var(--line)}
.nav .left{flex:1;text-align:center;font-size:13px;color:var(--muted)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.chip{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 16px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip.sm{padding:6px 12px;font-size:14px}
.chip.big{border-radius:12px;flex:1 1 130px;display:flex;flex-direction:column;align-items:center;font-size:22px;font-weight:600;padding:12px}
.chip.big small{font-size:12px;font-weight:400;opacity:.85}
.letters{display:flex;flex-direction:column;gap:10px}
.q{display:flex;flex-direction:column;gap:10px;padding:16px 0;border-top:1px solid var(--line)}
.q:first-of-type{border-top:0;padding-top:4px}
.qt{font-weight:600;display:flex;gap:10px}
.qt .num{flex:none;font-variant-numeric:tabular-nums;color:var(--accent);min-width:1.6em}
.nav.end{position:static;border-top:0}
.ab,.opts{display:grid;gap:8px}
.ab{grid-template-columns:1fr 1fr}
.opt{font:inherit;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:12px 14px;cursor:pointer;position:relative}
.opt:hover{border-color:var(--accent)}
.opt.on{border-color:var(--accent);background:var(--accent-soft);font-weight:500}
.opt.rank{padding-right:68px}
.opt.rank.r1{border-color:var(--second);background:var(--second-soft)}
.badge{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:12px;font-weight:600;color:var(--accent)}
.r1 .badge{color:var(--second)}
.legend{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px;font-size:14px}
.legend b{color:var(--accent)}
.task{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line)}
.task p{flex:1 1 220px;font-weight:500}
.flags{display:flex;gap:6px;flex-wrap:wrap}
.chart{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.radar{flex:1 1 240px;max-width:300px;width:100%;height:auto}
.radar .grid{fill:none;stroke:var(--line);stroke-width:1}
.radar .shape{fill:var(--accent);fill-opacity:.22;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.radar .dot{fill:var(--accent)}
.radar .lab{fill:var(--ink);font-size:14px;font-weight:600;font-family:var(--body)}
.radar .tick{fill:var(--muted);font-size:10px;font-family:var(--body)}
.bars{list-style:none;margin:0;padding:0;flex:1 1 260px;display:flex;flex-direction:column;gap:10px}
.bars li{display:grid;grid-template-columns:3em 1fr 2em;gap:4px 10px;align-items:center}
.bn{font-weight:600}.bv{font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.bt{height:10px;background:var(--paper);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bt i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bd{grid-column:1/-1;font-size:13px;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.two.in{gap:8px 24px}
.list{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.list.good li::marker{color:var(--accent)}.list.warn li::marker{color:var(--warn)}
.list small{display:block;color:var(--muted);font-size:13px}
.pill{display:inline-block;background:var(--accent-soft);border-radius:8px;padding:2px 10px;font-weight:600;letter-spacing:.08em}
.kv{font-weight:600}
.facts{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.facts.wide{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.facts div{border-left:3px solid var(--accent-soft);padding-left:10px}
.facts dt{font-size:13px;color:var(--muted)}
.facts dd{margin:0;font-weight:600}
.facts dd small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.alert{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-weight:500}
.code{display:flex;flex-direction:column;gap:8px}
.code label{font-weight:600;font-size:14px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--muted);font-weight:600;white-space:nowrap}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
tr.pick td{background:var(--accent-soft)}
footer{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:0 2px}
footer a{color:var(--muted)}
@media (max-width:480px){h2{font-size:22px}.ab{grid-template-columns:1fr}.card{padding:18px 16px}}
@media (prefers-reduced-motion:no-preference){.opt,.chip,.btn{transition:background-color .12s,border-color .12s}}
.field .optional{font-weight:400;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--accent)}
.row.between{justify-content:space-between}
.btn.sm{padding:6px 12px;font-size:14px}
.tag{font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;white-space:nowrap}
.thanks{align-items:center;text-align:center;padding:64px 20px}
#preview{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:14px;font-weight:500}
.wrap.wide{max-width:980px}
.login{max-width:440px}
.form{display:flex;flex-direction:column;gap:12px}
input[type=email],input[type=password]{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
</style>
</head>
<body>
<div class="wrap wide">
  <header class="top"><h1>창업가 역량 진단 관리자</h1><span>프라이밍스 스타트업 멘토링</span></header>
  <p id="preview" hidden>DB가 아직 연결되지 않은 미리보기 화면입니다. 아래 응답은 실제 응답이 아닌 예시입니다.</p>
  
  <main id="view"></main>
</div>
<script src="supabase.js"></script>
<script src="config.js"></script>
<script>
/* ===== 문항 (직장 경험이 없는 대학생도 답할 수 있는 말로 작성, 자체 제작) ===== */

/* 1부. 성향: 4개 지표 × 5문항. a = 앞 글자, b = 뒤 글자 */
const P_AXES = [["E", "I"], ["S", "N"], ["T", "F"], ["J", "P"]];
const P_ITEMS = [
  { ax: 0, q: "막히는 문제가 생기면", a: "누군가에게 말하면서 생각을 정리한다", b: "혼자 생각을 정리한 뒤에 말한다" },
  { ax: 1, q: "내 아이디어를 설명할 때", a: "지금 확인된 사실과 예시부터 말한다", b: "앞으로의 가능성과 큰 그림부터 말한다" },
  { ax: 2, q: "같이 하는 친구의 결과물이 기대에 못 미칠 때", a: "무엇이 문제인지 바로 말해 준다", b: "친구의 상황과 기분을 먼저 살핀다" },
  { ax: 3, q: "한 주를 보내는 방식은", a: "미리 계획을 세우고 그대로 움직인다", b: "상황을 보며 그때그때 정한다" },
  { ax: 0, q: "사람이 많은 모임에 다녀온 날은", a: "오히려 기운이 난다", b: "혼자 쉬는 시간이 필요하다" },
  { ax: 1, q: "새로운 것을 배울 때", a: "알려 준 방법을 순서대로 따라 한다", b: "원리를 이해한 뒤 내 방식으로 한다" },
  { ax: 2, q: "어려운 결정을 할 때 더 중요하게 보는 것은", a: "기준과 논리에 맞는가", b: "주변 사람들에게 어떤 영향을 주는가" },
  { ax: 3, q: "과제처럼 마감이 있는 일은", a: "여유 있게 미리 끝낸다", b: "마감이 가까워져야 몰아서 한다" },
  { ax: 0, q: "처음 보는 사람이 많은 자리에서", a: "먼저 말을 거는 편이다", b: "상대가 말을 걸어 오면 편하다" },
  { ax: 1, q: "자료를 볼 때 먼저 눈에 들어오는 것은", a: "구체적인 숫자와 세부 내용", b: "전체 흐름과 숨은 의미" },
  { ax: 2, q: "더 듣고 싶은 말은", a: "일을 정확하게 잘한다", b: "함께하기 좋은 사람이다" },
  { ax: 3, q: "계획이 갑자기 바뀌면", a: "불편하고 다시 정리하고 싶다", b: "새로운 상황이 오히려 재미있다" },
  { ax: 0, q: "집중이 가장 잘 되는 환경은", a: "사람들과 의견을 주고받는 자리", b: "조용히 혼자 있는 자리" },
  { ax: 1, q: "판단할 때 더 믿는 것은", a: "직접 겪은 경험", b: "문득 떠오르는 직감" },
  { ax: 2, q: "의견이 부딪칠 때", a: "어느 쪽이 맞는지 따져 본다", b: "서로 받아들일 수 있는 지점을 찾는다" },
  { ax: 3, q: "정해야 할 일이 있으면", a: "빨리 정하고 넘어가야 편하다", b: "선택지를 열어 두는 편이 편하다" },
  { ax: 0, q: "생각이 정리되는 때는", a: "말을 하는 도중", b: "말을 꺼내기 전" },
  { ax: 1, q: "조별 모임에서 더 자주 하는 말은", a: "그래서 구체적으로 뭘 하면 되죠?", b: "이걸 다르게 볼 수는 없을까요?" },
  { ax: 2, q: "부탁을 거절해야 할 때", a: "이유를 분명히 말하고 끝낸다", b: "사이가 나빠지지 않게 말을 고른다" },
  { ax: 3, q: "내 방과 파일은", a: "정해진 자리에 정리해 둔다", b: "필요할 때 찾으면 된다고 생각한다" }
];

/* 2부. 일하는 방식: 상황 12개 × 선택지 4개. 축 X 발상 · D 돌파 · V 검증 · O 운영. 1순위 2점, 2순위 1점 */
const W_KEYS = ["X", "D", "V", "O"];
const W_NAME = { X: "발상", D: "돌파", V: "검증", O: "운영" };
const W_DESC = {
  X: "새 기회와 아이디어를 찾는 힘",
  D: "사람을 움직여 빠르게 밀고 나가는 힘",
  V: "근거를 확인하고 위험을 걸러내는 힘",
  O: "체계를 세워 끝까지 마무리하는 힘"
};
const W_ITEMS = [
  { q: "해 보고 싶은 아이디어가 떠올랐을 때 가장 먼저 하는 일은", o: [["V", "비슷한 것이 이미 있는지 찾아본다"], ["X", "다른 방법은 없는지 여러 개 더 떠올린다"], ["O", "해야 할 일을 목록으로 적고 일정을 잡는다"], ["D", "주변에 말해 반응을 보고 같이 할 사람을 찾는다"]] },
  { q: "조별 과제나 동아리 회의에서 내가 주로 맡는 역할은", o: [["D", "결론을 내고 누가 언제까지 할지 정하게 만든다"], ["O", "내용을 정리하고 그 뒤 진행을 챙긴다"], ["X", "새로운 생각이나 다른 방법을 낸다"], ["V", "빠진 점과 문제가 될 부분을 짚는다"]] },
  { q: "하루가 통째로 비었다면 하고 싶은 일은", o: [["X", "새로 해 보고 싶은 일을 구상한다"], ["V", "궁금했던 것을 자료를 찾아 깊이 알아본다"], ["D", "사람들을 만나 내 생각을 이야기한다"], ["O", "밀린 일을 끝내고 주변을 정리한다"]] },
  { q: "일이 계획대로 풀리지 않을 때", o: [["O", "계획을 다시 나눠 하나씩 처리한다"], ["D", "일단 밀고 나가며 도와줄 사람을 찾는다"], ["V", "어디서 잘못됐는지 원인부터 따진다"], ["X", "방법 자체를 바꿔 본다"]] },
  { q: "내가 가장 뿌듯한 순간은", o: [["V", "내 예상이 정확히 맞아떨어졌을 때"], ["O", "맡은 일을 실수 없이 끝냈을 때"], ["D", "안 될 것 같던 사람을 설득해 냈을 때"], ["X", "아무도 생각하지 못한 방법을 찾았을 때"]] },
  { q: "공모전이나 발표 과제를 팀으로 준비한다면 내가 가장 잘할 부분은", o: [["X", "남다른 주제와 아이디어 내기"], ["D", "발표하고 질문에 답하기"], ["O", "일정 관리와 제출 서류 챙기기"], ["V", "자료 조사와 근거 찾기"]] },

/* --- 채점 --- */
function scorePersonality(p) {
  // p = {mode:'k', t:'ENTJ'} 또는 {mode:'q', a:[0|1 × 20]} (0 = 앞 글자)
  if (p.mode === "k") return { type: p.t, counts: null, source: "본인이 아는 유형 입력" };
  const c = [[0, 0], [0, 0], [0, 0], [0, 0]];
  P_ITEMS.forEach((it, i) => { c[it.ax][p.a[i]]++; });
  const type = c.map((x, i) => P_AXES[i][x[0] >= 3 ? 0 : 1]).join("");
  return { type, counts: c, source: "간이 성향 체크 20문항" };
}

function scoreWork(w) {
  // w = [[1순위 선택지 번호, 2순위 선택지 번호] × 12]
  const s = { X: 0, D: 0, V: 0, O: 0 };
  w.forEach((pick, i) => {
    s[W_ITEMS[i].o[pick[0]][0]] += 2;
    s[W_ITEMS[i].o[pick[1]][0]] += 1;
  });
  const order = W_KEYS.slice().sort((a, b) => s[b] - s[a] || W_KEYS.indexOf(a) - W_KEYS.indexOf(b));
  const spread = s[order[0]] - s[order[3]];
  const balanced = spread <= 3;
  const pair = [order[0], order[1]].sort((a, b) => W_KEYS.indexOf(a) - W_KEYS.indexOf(b)).join("");
  return { s, order, spread, balanced, typeKey: balanced ? "BAL" : pair, top: order[0], second: order[1], weak: order[3], weak2: order[2] };
}

function taskScore(m) { return (m & 1 ? 1 : 0) + (m & 2 ? 1 : 0) + (m & 4 ? 1 : 0) + (m & 8 ? 2 : 0); }

function scoreAI(q, t) {
  t = t || Array(24).fill(0);
  // q = 12문항 응답(1부터), t = 업무 24개 비트마스크(시간1 반복2 못함4 목표8)
  const Q = n => q[n - 1];
  const track = Q(1) <= 2 ? "예비창업자 트랙" : "초기창업자 트랙";
  const lv = Math.max(0, Q(4) - 1 - (Q(4) >= 3 && Q(5) === 1 ? 1 : 0));
  const lvPts = lv <= 1 ? 0 : lv === 2 ? 1 : lv === 3 ? 2 : 3;
  const typeScore = lvPts + (Q(3) - 1) + (Q(1) - 1);
  const base = typeScore <= 3 ? "S" : typeScore <= 6 ? "M" : "L";
  const c1 = base === "L" && !(lv >= 4 || Q(10) === 3) ? "M" : base;
  let fin;
  if (c1 === "L") fin = Q(7) >= 4 ? "L" : Q(7) >= 3 ? "M" : "S";
  else if (c1 === "M") fin = Q(7) >= 3 ? "M" : "S";
  else fin = "S";
  const budgetNote = fin !== c1 ? "도구 예산을 늘리면 " + c1 + "형 가능" : "예산 적정";
  const hold = Q(6) === 1;
  const scores = t.map(taskScore);
  const areaHit = AREAS.map((_, a) => T_ITEMS.some((it, i) => it[0] === a && scores[i] > 0));
  const areaCount = areaHit.filter(Boolean).length;
  const sigList = [
    [Q(3) >= 3, "팀 3인 이상"], [areaCount >= 5, "업무 영역 5종 이상"], [lv >= 3, "AI 레벨 Lv3 이상"],
    [Q(9) === 3, "동시 진행 업무 잦음"], [Q(10) === 3, "외부 도구 연동·자동화 필수"], [Q(11) === 3, "월 1회 이상 인수인계"]
  ];
  const signals = sigList.filter(x => x[0]).map(x => x[1]);
  const n = signals.length;
  let method;
  if (fin === "L") method = "방식 B (L2~L3)";
  else if (fin === "S") method = n >= 3 ? "방식 A (B 신호 많음: M형 검토)" : "방식 A";
  else method = n >= 3 ? "방식 B (L1~L2)" : "방식 A로 시작 → 전환 기준 점검";
  const stPre = ["예비 Stage 1 지원사업 합격 스프린트", "예비 Stage 2 MVP 기획·개발", "예비 Stage 3 사업화·초기 마케팅", "예비 Stage 3 사업화·초기 마케팅", "예비 Stage 3 사업화·초기 마케팅"];
  const stEarly = ["초기 Stage 1 → Stage 2 지원사업·BM 고도화", "초기 Stage 1 → Stage 2 BM·제품 정비", "초기 Stage 1 → Stage 3 마케팅·영업", "초기 Stage 1 → Stage 3 마케팅·영업", "초기 Stage 1 → Stage 4 조직관리 · Stage 5 AX"];
  const stage = (Q(1) <= 2 ? stPre : stEarly)[Q(2) - 1];
  const knowledge = ["L0 흩어진 파일 — 폴더·회사 바이블부터", "L1에 가까움 — 규칙만 정하면 됨", "L1~L2 — 지식DB 연결부터"][Q(8) - 1];
  const product = fin === "S" ? "스타터(S형) · 1:1 4주" : fin === "M" ? "그로스(M형) · 1:1 12주" : "프로(L형) · 1:1 12주";
  const top5 = scores.map((sc, i) => ({ i, sc })).filter(x => x.sc >= 1).sort((a, b) => b.sc - a.sc || a.i - b.i).slice(0, 5);
  const agentScore = {};
  AGENTS.forEach(a => { agentScore[a] = 0; });
  T_ITEMS.forEach((it, i) => { agentScore[it[2]] += scores[i]; });
  return { track, lv, typeScore, base, c1, fin, budgetNote, hold, scores, areaCount, signals, method, stage, knowledge, product, top5, agentScore, pre: Q(1) <= 2 };
}

/* 업무 점수 + 성향 보완을 합친 AI 직원 추천 */
function recommendAgents(ai, work) {
  const bonus = {};
  AGENTS.forEach(a => { bonus[a] = 0; });
  if (!work.balanced) {
    AXIS_AGENTS[work.weak].forEach(a => { bonus[a] += 2; });
    AXIS_AGENTS[work.weak2].forEach(a => { bonus[a] += 1; });
  }
  const rows = AGENTS.map((a, idx) => ({
    name: a, task: ai.agentScore[a], bonus: bonus[a], total: ai.agentScore[a] + bonus[a], idx,
    why: [ai.agentScore[a] > 0 ? "업무 체크 " + ai.agentScore[a] + "점" : null,
      !work.balanced && AXIS_AGENTS[work.weak].includes(a) ? W_NAME[work.weak] + " 보완" : null,
      !work.balanced && AXIS_AGENTS[work.weak2].includes(a) ? W_NAME[work.weak2] + " 보완" : null].filter(Boolean)
  })).filter(r => r.total > 0).sort((a, b) => b.total - a.total || b.task - a.task || a.idx - b.idx);
  const count = ai.fin === "S" ? 4 : ai.fin === "M" ? 6 : 8;
  return { rows, count, pick: rows.slice(0, count) };
}

function computeAll(d) {
  const per = scorePersonality({ mode: "q", a: d.a }), work = scoreWork(d.w), ai = scoreAI(d.s, d.t);
  return { d, per, work, ai, rec: recommendAgents(ai, work), hasTasks: Array.isArray(d.t) && d.t.some(x => x > 0) };
}

function crossInsights(per, work) {
  const has = c => per.type.includes(c), out = [], b = work.balanced;
  if (!b && has("P") && work.weak === "O") out.push("유연한 성향에 운영이 가장 낮습니다. 마감·증빙 누락 위험이 가장 큰 조합입니다. 지원사업 비서와 운영 담당 AI에 주간 점검을 맡기는 것을 첫 과제로 둡니다.");
  if (!b && has("J") && work.weak === "O") out.push("계획 세우기는 편하지만 반복 운영에는 힘이 덜 실립니다. 계획은 대표가, 진행 점검은 운영 담당 AI가 맡도록 나눕니다.");
  if (!b && has("N") && work.weak === "O" && !has("P")) out.push("큰 그림을 보는 성향이라 세부 실행이 비기 쉽습니다. 할 일 관리를 AI에 맡기는 효과가 큽니다.");
  if (!b && has("I") && work.weak === "D") out.push("혼자 집중하는 성향에 돌파가 가장 낮습니다. 대외 접촉이 가장 큰 병목이 되기 쉽습니다. 영업 지원 AI의 초안과 주간 접촉 횟수 목표가 필요합니다.");
  if (!b && has("E") && work.weak === "D") out.push("사람을 만나는 것은 편하지만 설득해 결론을 내는 힘은 낮게 나왔습니다. 만남마다 다음 약속을 정하는 연습이 필요합니다.");
  if (!b && has("E") && work.top === "D") out.push("대외 활동에서 힘을 얻고 돌파도 가장 높습니다. 영업과 발표는 대표가 직접 맡고, 준비와 뒤처리를 AI에 넘기는 구성이 맞습니다.");
  if (!b && has("N") && work.top === "X") out.push("가능성을 보는 성향에 발상이 가장 높습니다. 아이디어가 넘치는 만큼 보관함과 2주 규칙으로 우선순위를 지켜야 합니다.");
  if (!b && has("S") && work.weak === "X") out.push("현실 중심 성향에 발상이 가장 낮습니다. 차별화 포인트는 리서처 AI의 사례 조사와 고객 인터뷰로 채웁니다.");
  if (!b && has("T") && work.top === "V") out.push("논리 중심 성향에 검증이 가장 높습니다. 비판이 날카로워 팀원이 위축될 수 있어 피드백 방식을 함께 다룹니다.");
  if (!b && has("F") && work.weak === "V") out.push("관계 중심 성향에 검증이 가장 낮습니다. 듣기 좋은 반응만 모으기 쉬우니 심사위원 AI에게 반대 의견을 맡깁니다.");
  if (!b && has("J") && work.top === "O") out.push("계획적인 성향에 운영이 가장 높습니다. 체계는 탄탄하지만 위임이 어렵고 변화 대응이 늦을 수 있습니다.");
  if (has("F")) out.push("거절과 가격 협상처럼 관계가 걸린 말은 영업 지원 AI로 초안을 만들어 두면 미루지 않게 됩니다.");
  if (!out.length) out.push("성향과 일하는 방식 사이에 두드러진 충돌은 보이지 않습니다. 상담에서 최근 실제 사례로 확인합니다.");
  return out;
}

const $ = id => document.getElementById(id);

let rows = [], state = "loading", errMsg = "", sel = null, user = null, loginMsg = "";

function parseRow(r) {
  try {
    const d = r.d || JSON.parse(r.json);
    if (!Array.isArray(d.a) || d.a.length !== 20 || !Array.isArray(d.w) || d.w.length !== 12 || !Array.isArray(d.s) || d.s.length !== 12) throw new Error("형식");
    return Object.assign({}, r, { res: computeAll(d) });
  } catch (e) { return Object.assign({}, r, { res: null }); }
}
function fmt(at) { const t = new Date(at); return isNaN(t) ? String(at) : t.toLocaleString("ko-KR", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }); }
const typeTitle = work => TYPES[work.typeKey].name + (work.balanced ? "" : " (" + W_NAME[work.top] + " + " + W_NAME[work.second] + ")");

function load() {
  state = "loading"; errMsg = ""; render();
  const ok = list => { rows = (list || []).map(parseRow); state = "ready"; render(); };
  if (!HAS_SERVER) { setTimeout(() => ok(SAMPLES), 200); return; }
  let settled = false;
  const fail = msg => { if (settled) return; settled = true; state = "error"; errMsg = msg; render(); };
  const timer = setTimeout(() => fail("응답을 불러오는 데 시간이 오래 걸립니다. 인터넷 연결을 확인하고 새로 고침을 눌러 주세요."), 20000);
  sb.from("responses").select("*").order("created_at", { ascending: false }).then(res => {
    clearTimeout(timer);
    if (settled) return;
    if (res.error) { fail("응답을 불러오지 못했습니다. 새로 고침을 눌러 주세요. (" + (res.error.message || "") + ")"); return; }
    settled = true;
    ok((res.data || []).map(x => {
      const w = Array.isArray(x.w) ? x.w : [];
      return { row: x.id, at: x.created_at, n: x.name, org: x.org, contact: x.contact,
        d: { a: x.a, s: x.s, w: Array.from({ length: Math.floor(w.length / 2) }, (_, i) => [w[2 * i], w[2 * i + 1]]) } };
    }));
  }, () => { clearTimeout(timer); fail("응답을 불러오지 못했습니다. 인터넷 연결을 확인하고 새로 고침을 눌러 주세요."); });
}

  if (state === "error") { v.innerHTML = '<section class="card"><p class="alert" role="alert">' + esc(errMsg) + '</p><div class="row">' + '<button class="btn" data-act="reload">새로 고침</button>' + (user ? '<button class="btn ghost" data-act="logout">로그아웃</button>' : "") + "</div></section>"; return; }

function radar(s) {
  const C = 150, R = 96, MAX = 24, pos = { X: [0, -1], D: [1, 0], O: [0, 1], V: [-1, 0] }, K = ["X", "D", "O", "V"];
  const pt = (k, v) => [C + pos[k][0] * R * v / MAX, C + pos[k][1] * R * v / MAX];
  let g = "";
  [6, 12, 18, 24].forEach(v => { g += '<polygon class="grid" points="' + K.map(k => pt(k, v).join(",")).join(" ") + '"/>'; });
  g += '<line class="grid" x1="' + (C - R) + '" y1="' + C + '" x2="' + (C + R) + '" y2="' + C + '"/><line class="grid" x1="' + C + '" y1="' + (C - R) + '" x2="' + C + '" y2="' + (C + R) + '"/>';
  g += '<polygon class="shape" points="' + K.map(k => pt(k, s[k]).join(",")).join(" ") + '"/>';
  K.forEach(k => { const p = pt(k, s[k]); g += '<circle class="dot" cx="' + p[0] + '" cy="' + p[1] + '" r="4"/>'; });
  const lab = { X: [C, 26, "middle"], D: [C + R + 10, C + 5, "start"], O: [C, 2 * C - 12, "middle"], V: [C - R - 10, C + 5, "end"] };
  K.forEach(k => { g += '<text class="lab" x="' + lab[k][0] + '" y="' + lab[k][1] + '" text-anchor="' + lab[k][2] + '">' + W_NAME[k] + " " + s[k] + "</text>"; });
  g += '<text class="tick" x="' + (C + 4) + '" y="' + (C - R + 12) + '">24</text><text class="tick" x="' + (C + 4) + '" y="' + (C - R / 2 + 4) + '">12</text>';
  return '<svg class="radar" viewBox="0 0 300 300" role="img" aria-label="일하는 방식 점수: 발상 ' + s.X + ", 돌파 " + s.D + ", 검증 " + s.V + ", 운영 " + s.O + ' (각 24점 만점)">' + g + "</svg>";
}

  const signals = ai.signals.filter(x => x !== "업무 영역 5종 이상");
  let h = '<div class="row"><button class="btn ghost" data-act="back">목록으로</button></div><div id="report">';
  h += '<section class="card hero"><p class="eyebrow">' + esc(row.n) + (row.org ? " · " + esc(row.org) : "") + (row.contact ? " · " + esc(row.contact) : "") + " · " + esc(fmt(row.at)) + " 제출</p><h2>" + esc(typeTitle(w)) + " · " + esc(r.per.type) + " · AI Lv" + ai.lv + '</h2><p class="lead">' + esc(T.line) + '</p><dl class="facts wide">' +
    [["트랙", ai.track], ["AI 조직 유형", ORG[ai.fin][0] + (ai.fin !== ai.base ? " (기본 " + ai.base + "형에서 보정)" : "")], ["유형 점수", ai.typeScore + "점 / 9"], ["운영 방식", ai.method + (ai.pre ? " · 예비 트랙은 방식 A로 시작" : "")], ["시작 단계", ai.stage], ["자료 정리 수준", ai.knowledge], ["도구 예산", ai.budgetNote], ["참여 시간", ai.hold ? "보류 — 주 2시간 이상 확보 필요" : "진행 가능"], ["권장 상품", ai.hold ? "부트캠프·템플릿 팩·전략 컨설팅 먼저" : ai.product]]
      .map(x => "<div><dt>" + x[0] + "</dt><dd>" + esc(x[1]) + "</dd></div>").join("") + "</dl>" +
    '<p class="fine">방식 B 신호 ' + signals.length + "개" + (signals.length ? ": " + esc(signals.join(", ")) : "") + ". 업무 체크를 하지 않아 업무 영역 수 신호는 빼고 셌습니다.</p></section>";

  h += '<section class="card"><h3>1. 리더십 스타일과 강약점</h3><div class="chart">' + radar(w.s) + bars(w) + "</div><p>" + esc(T.sum) + "</p>" +
    '<div class="two in"><div><h4>강점</h4><ul class="list good">' + li(T.str) + '</ul></div><div><h4>빠지기 쉬운 함정</h4><ul class="list warn">' + li(T.pit) + "</ul></div></div>" +
    '<dl class="facts wide"><div><dt>힘을 내는 국면</dt><dd>' + esc(T.fit) + "</dd></div><div><dt>조심할 국면</dt><dd>" + esc(T.care) + "</dd></div>" +
    (w.balanced ? "" : "<div><dt>가장 높은 축 · " + W_NAME[w.top] + " " + w.s[w.top] + "</dt><dd>" + AX[w.top].high + "</dd></div><div><dt>가장 낮은 축 · " + W_NAME[w.weak] + " " + w.s[w.weak] + "</dt><dd>" + AX[w.weak].low + "</dd></div>") + "</dl>" +
    "<h4>성향 · " + esc(r.per.type) + " · " + esc(tm[0]) + "</h4><p>" + esc(tm[1]) + '</p><div class="tablewrap"><table><thead><tr><th>지표</th><th>특징</th><th>주의</th><th>응답</th></tr></thead><tbody>' +
    L4.map((c, i) => "<tr><td><b>" + c + "</b> " + LET[c].t + "</td><td>" + LET[c].s + "</td><td>" + LET[c].c + '</td><td class="n">' + r.per.counts[i][0] + " : " + r.per.counts[i][1] + (Math.abs(r.per.counts[i][0] - r.per.counts[i][1]) === 1 ? " (약함)" : "") + "</td></tr>").join("") +
    '</tbody></table></div><p class="fine">간이 성향 체크 20문항 기준입니다. 3 : 2로 갈린 지표는 선호가 약하므로 상담에서 확인합니다.</p>' +
    '<h4>성향과 일하는 방식을 함께 보면</h4><ul class="list">' + li(crossInsights(r.per, w)) + "</ul></section>";

  h += '<section class="card"><h3>2. 보완할 AI 직원 구성</h3>';
  if (w.balanced) h += "<p>네 축이 고르게 나와 특정 축을 메우는 AI 직원을 따로 꼽지 않았습니다. 상담에서 시간을 가장 많이 쓰는 일을 물어 첫 AI 직원을 정합니다.</p>";
  else h += "<p>낮게 나온 일하는 방식을 메우는 AI 직원입니다. 가장 낮은 축에 +2, 그다음 축에 +1을 주었습니다. " + ORG[ai.fin][0].slice(0, 2) + "은 상위 " + r.rec.count + "개까지 둡니다.</p>" +
    '<div class="tablewrap"><table><thead><tr><th>순위</th><th>AI 직원</th><th>보완 점수</th><th>근거</th></tr></thead><tbody>' +
    r.rec.rows.map((x, i) => '<tr class="' + (i < r.rec.count ? "pick" : "") + '"><td class="n">' + (i + 1) + "</td><td>" + esc(x.name) + '</td><td class="n"><b>+' + x.total + "</b></td><td>" + esc(x.why.join(" · ")) + "</td></tr>").join("") + "</tbody></table></div>" +
    '<p class="fine">' + W_NAME[w.weak] + " 보완: " + AXIS_AGENT_WHY[w.weak] + ". " + W_NAME[w.weak2] + " 보완: " + AXIS_AGENT_WHY[w.weak2] + ".</p>";
  h += '<p class="fine">이번 진단에는 업무 체크가 없어 실제 업무량은 반영하지 않았습니다. 첫 업무와 최종 구성은 상담에서 업무 체크(추가 옵션)로 확정합니다.</p>' +
    '<h4>AI 도입 코칭 포인트</h4><ul class="list"><li>' + AI_COACH_LV[ai.lv] + " (Lv" + ai.lv + " " + LV_NAME[ai.lv] + ")</li>" + (w.balanced ? "" : "<li>" + AI_COACH_STYLE[w.top] + "</li>") + (r.d.s[11] === 1 ? "<li>처음 해 보는 분야입니다. 리서처를 첫 AI 직원 후보에 반드시 넣습니다.</li>" : "") + (r.d.s[3] >= 3 && r.d.s[4] === 1 ? "<li>사용 빈도에 비해 실제 적용 경험이 없어 레벨을 한 단계 낮췄습니다. 10분 실습으로 다시 확인합니다.</li>" : "") + "</ul></section>";

  h += '<section class="card"><h3>3. 팀빌딩과 공동창업자 제안</h3>';
  if (w.balanced) h += "<p>네 축이 고르게 나와 특정 역할의 공백보다 본인의 시간 부족이 먼저 문제가 됩니다. 시간을 많이 쓰는 일부터 AI 직원에게 넘기고, 사람 영입은 매출이 생기는 역할에 맞춥니다.</p>";
  else h += '<div class="tablewrap"><table><thead><tr><th>빈자리</th><th>AI로 먼저 메울 수 있는 부분</th><th>사람이 꼭 필요한 부분</th><th>맞는 사람</th></tr></thead><tbody>' +
    [w.weak, w.weak2].map((k, i) => "<tr><td><b>" + W_NAME[k] + "</b> " + w.s[k] + "점" + (i === 0 ? " (1순위)" : "") + "</td><td>" + AX[k].aiCan + "</td><td>" + AX[k].humanMust + "</td><td>" + AX[k].human + "</td></tr>").join("") + "</tbody></table></div>" +
    '<ul class="list"><li>본인과 같은 ' + W_NAME[w.top] + "·" + W_NAME[w.second] + " 중심의 사람만 모이면 " + W_NAME[w.weak] + " 공백이 그대로 남습니다. 첫 팀원은 " + W_NAME[w.weak] + " 점수가 높은 사람을 우선합니다.</li>" +
    "<li>성향이 반대인 사람과 일하면 처음에는 불편합니다. " + (L4[2] === "T" ? "논리 중심이므로 상대의 감정 표현을 문제 제기로 받아들이는 연습이 필요합니다." : "관계 중심이므로 상대의 직설적인 지적을 공격으로 받아들이지 않는 연습이 필요합니다.") + "</li>" +
    "<li>" + (r.d.s[2] === 1 ? "지금은 혼자입니다. 팀원을 구하기 전에 AI 직원으로 3개월 운영해 보고, 그래도 남는 공백을 사람으로 채웁니다." : "이미 함께하는 사람이 있습니다. 팀원도 같은 진단을 받아 역할을 나누면 겹침과 공백이 보입니다.") + "</li></ul>";
  h += "</section>";

  h += '<section class="card"><h3>4. 멘토링 세션 가이드</h3><div class="two in"><div><h4>이렇게 접근합니다</h4><ul class="list good">' + li(T.doo.concat(LET[L4[0]].m, LET[L4[3]].m)) + '</ul></div><div><h4>피합니다</h4><ul class="list warn">' + li(T.dont) + "</ul></div></div>" +
    '<h4>코칭 질문</h4><ol class="list">' + li(T.qs) + "</ol>" +
    '<h4>4주 실행 과제</h4><ol class="list">' + li(T.hw.concat(w.balanced ? [] : [AX[w.weak].hw])) + "</ol>" +
    '<h4>세션 진행 순서</h4><div class="tablewrap"><table><thead><tr><th>회차</th><th>다룰 내용</th><th>남길 것</th></tr></thead><tbody>' +
    "<tr><td>1회</td><td>진단 결과 설명, 강점 확인, 조심할 국면 합의, 업무 체크로 첫 업무 정하기</td><td>진단 결과서 1쪽, 첫 업무 1개</td></tr>" +
    "<tr><td>2회</td><td>AI 직원 구성 확정, 첫 업무를 AI 직원에게 맡기는 실습</td><td>AI 조직 설계서 1장, 승인 규칙</td></tr>" +
    "<tr><td>3회</td><td>2주 실업무 파일럿 점검, " + (w.balanced ? "시간 사용 기록 검토" : W_NAME[w.weak] + " 보완 과제 점검") + "</td><td>파일럿 기록, 고친 지침</td></tr>" +
    "<tr><td>4회</td><td>팀빌딩 방향, 다음 3개월 목표, 단독 수행 확인</td><td>3개월 계획, 다음 진단 날짜</td></tr></tbody></table></div></section>";

  h += '<section class="card"><h3>5. 응답 원본</h3><div class="tablewrap"><table><thead><tr><th>AI 활용과 창업 준비</th><th>응답</th></tr></thead><tbody>' +
    S_ITEMS.map((it, i) => "<tr><td>Q" + (i + 1) + " " + esc(it.q) + "</td><td>" + r.d.s[i] + " " + esc(it.o[r.d.s[i] - 1]) + "</td></tr>").join("") + "</tbody></table></div>" +
    '<div class="tablewrap"><table><thead><tr><th>일하는 방식</th><th>1순위</th><th>2순위</th></tr></thead><tbody>' +
    W_ITEMS.map((it, i) => "<tr><td>" + (i + 1) + ". " + esc(it.q) + "</td>" + r.d.w[i].map(j => "<td>" + esc(it.o[j][1]) + ' <span class="tag">' + W_NAME[it.o[j][0]] + "</span></td>").join("") + "</tr>").join("") + "</tbody></table></div>" +
    '<div class="row"><button class="btn" data-act="copyReport">리포트 글 전체 복사</button><span id="copyMsg" class="fine" aria-live="polite"></span></div>' +
    '<p class="fine">스스로 답한 진단이라 실제보다 높게 답하는 경향이 있습니다. AI 레벨은 10분 실습으로, 일하는 방식은 최근 사례 질문으로 확인한 뒤 확정합니다. 채용·평가의 근거로 쓰지 않습니다.</p></section></div>';
  return h;
}

document.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  const d = b.dataset;
  if (d.open) { sel = d.open; render(); window.scrollTo(0, 0); return; }
  if (d.act === "back") { sel = null; render(); window.scrollTo(0, 0); return; }
  if (d.act === "reload") { sel = null; load(); return; }
  if (d.act === "logout") { sel = null; sb.auth.signOut(); return; }
  if (d.act === "copyReport") {
    const m = $("copyMsg"), done = ok => { m.textContent = ok ? "복사했습니다" : "자동 복사가 막혀 있습니다. 화면에서 직접 선택해 복사해 주세요."; };
    try { navigator.clipboard.writeText($("report").innerText).then(() => done(true), () => done(false)); } catch (x) { done(false); }
  }
});
document.addEventListener("submit", e => {
  if (e.target.id !== "loginForm") return;
  e.preventDefault();
  const em = $("em").value.trim(), pw = $("pw").value;
  loginMsg = "";
  sb.auth.signInWithPassword({ email: em, password: pw }).then(res => {
    if (res.error) { loginMsg = "이메일 또는 비밀번호가 맞지 않습니다."; render(); const f = $("em"); if (f) f.value = em; }
  });
});
if (!HAS_SERVER) { $("preview").hidden = false; load(); }
else {
  let lastUid = null;
  sb.auth.onAuthStateChange((event, session) => {
    const u = session ? session.user : null, uid = u ? u.id : "";
    if (uid === lastUid) return; /* 토큰 갱신 같은 반복 알림은 무시 */
    lastUid = uid; user = u; sel = null;
    /* 인증 알림 안에서 바로 DB를 부르지 않도록 한 박자 늦춘다 */
    setTimeout(() => { if (u) load(); else { state = "login"; render(); } }, 0);
  });
}

</script>
</body>
</html>
